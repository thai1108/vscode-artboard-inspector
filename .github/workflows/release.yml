name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Fail if the release already exists
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi

      # Runs pnpm check before vsce package.
      - run: pnpm package

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## / { if (on) exit; on = ($2 == v); next }
            on
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "NOTES_ARGS=--notes-file $RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"
          else
            echo "::warning::No CHANGELOG.md section for $VERSION; using generated notes"
            echo "NOTES_ARGS=--generate-notes" >> "$GITHUB_ENV"
          fi

      - name: Create the release
        run: |
          # shellcheck disable=SC2086
          gh release create "$TAG" "artboard-inspector-$VERSION.vsix" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Artboard Inspector $VERSION" $NOTES_ARGS
