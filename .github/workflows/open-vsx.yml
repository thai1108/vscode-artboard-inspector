name: Publish to Open VSX

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      OPEN_VSX:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose .vsix is published (e.g. v0.3.0)
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      OVSX_PAT: ${{ secrets.OPEN_VSX }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download the release .vsix
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a release tag like v1.2.3"
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix' --dir "$RUNNER_TEMP/vsix"
          vsix=$(ls "$RUNNER_TEMP"/vsix/*.vsix)
          publisher=$(unzip -p "$vsix" extension/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).publisher")
          echo "VSIX=$vsix" >> "$GITHUB_ENV"
          echo "NAMESPACE=$publisher" >> "$GITHUB_ENV"

      # Open VSX publishes into a namespace named after the publisher, which must exist first.
      - name: Create the namespace when it is missing
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/$NAMESPACE")
          if [ "$status" = 404 ]; then
            npx --yes ovsx@1.2.0 create-namespace "$NAMESPACE"
          elif [ "$status" != 200 ]; then
            echo "::error::Open VSX answered $status for namespace $NAMESPACE"
            exit 1
          fi

      - name: Publish
        run: npx --yes ovsx@1.2.0 publish --packagePath "$VSIX" --skip-duplicate
